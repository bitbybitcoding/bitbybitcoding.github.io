<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/bitbybitcoding/bitbybitcoding.github.io/main/.github/assets/logo.png" />
    <title>Bit by Bit Coding</title>
    <script>
      (function () {
        const { pathname, search, hash } = window.location;
        const targetOrigin = 'https://bbbcoding.vercel.app';
        const hasHashRoute = hash.startsWith('#/');
        const route = hasHashRoute ? hash.slice(1) : `${pathname}${search}${hash}`;
        const normalizedRoute = route === '/' ? '' : route;
        const targetUrl = normalizedRoute ? `${targetOrigin}/#${normalizedRoute}` : `${targetOrigin}/`;
        window.location.replace(targetUrl);
      })();
    </script>
  </head>
  <body></body>
</html>
